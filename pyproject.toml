[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivevision-yolo"
version = "0.1.0"
description = "Research-grade autonomous-driving perception framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "PyYAML>=6", "ultralytics>=8.3", "torch>=2.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
